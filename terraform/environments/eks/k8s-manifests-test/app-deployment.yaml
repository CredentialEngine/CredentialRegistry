apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-app
  namespace: credreg-test
  labels:
    app: main
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: main-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: main-app
        app-lang: ruby
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - bin/rackup -o 0.0.0.0
        env:
        - name: NEW_RELIC_APP_NAME
          value: Credential Engine Test
        - name: SIDEKIQ_CONCURRENCY
          value: "5"
        - name: PUMA_MAX_THREADS
          value: "8"
        - name: WEB_CONCURRENCY
          value: "1"
        - name: ARGO_WORKFLOWS_TOKEN_PATH
          value: /var/run/secrets/argo-workflows/token
        envFrom:
        - secretRef:
            name: app-secrets
        - configMapRef:
            name: main-app-config
        image: 996810415034.dkr.ecr.us-east-1.amazonaws.com/registry:2026.11.14.0175
        imagePullPolicy: Always
        name: main-app
        ports:
        - containerPort: 9292
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 2Gi
          requests:
            cpu: 128m
            memory: 768Mi
        volumeMounts:
        - mountPath: /var/run/secrets/argo-workflows
          name: argo-workflows-token
          readOnly: true
      nodeSelector:
        env: test
      priorityClassName: test-normal
      serviceAccountName: main-app-service-account
      tolerations:
      - effect: NoSchedule
        key: env
        operator: Equal
        value: test
      volumes:
      - name: argo-workflows-token
        secret:
          items:
          - key: token
            path: token
          secretName: argo-workflows-token
