apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-app
  namespace: credreg-test
  labels:
    app: worker-app
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: worker-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: worker-app
        app-lang: ruby
    spec:
      containers:
      - args:
        - |
          if [ -x ./bin/sidekiq ]; then
            ./bin/sidekiq -r ./config/application.rb
          else
            bundle exec sidekiq -r ./config/application.rb
          fi
        command:
        - /bin/bash
        - -lc
        env:
        - name: NEW_RELIC_APP_NAME
          value: Credential Engine Test
        - name: PATH
          value: /app/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
        - name: ARGO_WORKFLOWS_TOKEN_PATH
          value: /var/run/secrets/argo-workflows/token
        envFrom:
        - secretRef:
            name: app-secrets
        - configMapRef:
            name: main-app-config
        image: 996810415034.dkr.ecr.us-east-1.amazonaws.com/registry:2026.11.14.0175
        imagePullPolicy: Always
        name: worker
        resources:
          limits:
            cpu: '1'
            memory: 3Gi
          requests:
            cpu: 256m
            memory: 384Mi
        volumeMounts:
        - mountPath: /var/run/secrets/argo-workflows
          name: argo-workflows-token
          readOnly: true
      nodeSelector:
        env: test
      priorityClassName: test-normal
      serviceAccountName: main-app-service-account
      tolerations:
      - effect: NoSchedule
        key: env
        operator: Equal
        value: test
      volumes:
      - name: argo-workflows-token
        secret:
          items:
          - key: token
            path: token
          secretName: argo-workflows-token
