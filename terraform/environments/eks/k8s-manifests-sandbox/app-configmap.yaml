apiVersion: v1
kind: ConfigMap
metadata:
  name: main-app-config
  namespace: credreg-sandbox
data:
  POSTGRESQL_DATABASE: credential_registry_sandbox
  POSTGRESQL_USERNAME: credential_registry_sandbox
  RACK_ENV: sandbox
  DOCKER_ENV: "true"
  ENVELOPE_GRAPHS_BUCKET: cer-envelope-graphs-sandb
  ENVELOPE_DOWNLOADS_BUCKET: cer-envelope-downloads
  IAM_COMMUNITY_ROLE_ADMIN: ROLE_ADMINISTRATOR
  IAM_COMMUNITY_ROLE_READER: ROLE_READER
  IAM_COMMUNITY_ROLE_PUBLISHER: ROLE_PUBLISHER
  IAM_COMMUNITY_CLAIM_NAME: community_name
  IAM_CLIENT_ID: RegistryAPI
  IAM_URL: https://login.sandbox.credentialengine.org/realms/CE-Sandbox
  AIRBRAKE_PROJECT_ID: '270205'
  SIDEKIQ_CONCURRENCY: '10'
  LOG_LEVEL: "WARN"
  SWAGGER_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "false"
  NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED: "500"
  NEW_RELIC_TRANSACTION_EVENTS_MAX_SAMPLES_STORED: "300"
  API_KEY_VALIDATION_ENDPOINT: https://sandbox.credentialengine.org/accountsAPI/Organization/ValidateCommunityAccess
  ELASTICSEARCH_ADDRESS: http://elasticsearch:9200
  # Registry changeset sync -> Publisher (S3 auth via pod IRSA, not static keys)
  # NOTE: endpoint host pending client confirmation
  REGISTRY_CHANGESET_SYNC_ENDPOINT: https://api.publisher.sandbox.credentialengine.org/changeset/upload
  REGISTRY_CHANGESET_SYNC_ENDPOINT_RETRY_INTERVAL_SECONDS: '30'
  REGISTRY_CHANGESET_SYNC_DEBOUNCE_SECONDS: '60'
  REGISTRY_CHANGESET_SYNC_ENDPOINT_TIMEOUT_SECONDS: '60'
  REGISTRY_CHANGESET_SYNC_BUCKET: cer-registry-changesets-sandbox
  AWS_REGION: us-east-1
