
name: Run linter and tests

on:
  push:
    branches:
      - master
      - simplecov
      - semgrep_fixes
      - hardening-dockerfile-sq
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
  GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}

jobs:
  test:
    name: "Lint, test & analyse"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: registry_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:8.2.1-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/registry_test
      REDIS_URL: redis://localhost:6379/3
      RACK_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      - name: Pre-cache grape-middleware-logger gem
        run: |
          mkdir -p vendor/cache
          if [ -f local_packages/grape-middleware-logger-2.4.0.gem ]; then
            cp -v local_packages/grape-middleware-logger-2.4.0.gem vendor/cache/
          fi

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false
          ruby-version: '3.4'
      - name: Install gems (non-frozen)
        run: |
          bundle config set path vendor/bundle
          bundle config set frozen false
          bundle install --jobs 4
      - run: RACK_ENV=test bundle exec rake db:migrate
      # Rubocop, bundler-audit, etc. are executed through Overcommit hooks.

      - name: Run Overcommit hooks
        run: |
          bundle exec overcommit --sign
          bundle exec overcommit --run
        continue-on-error: true
      # Sidekiq is a separate OS process, not ActiveJob's inline test adapter.
      # GitHub-hosted jobs talk to service containers via published localhost ports.
      - name: Start Sidekiq integration worker
        run: |
          bundle exec sidekiq -r "$PWD/config/environment.rb" -C config/sidekiq.yml > "$RUNNER_TEMP/sidekiq.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sidekiq.pid"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/sidekiq.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/sidekiq.log"
              exit 1
            fi
            if bundle exec ruby -r sidekiq/api -e 'exit(Sidekiq::ProcessSet.new.size.positive? ? 0 : 1)' 2>/dev/null; then
              echo "Sidekiq worker registered with Redis"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/sidekiq.log"
              echo "Sidekiq worker did not register in Redis"
              exit 1
            fi
            sleep 2
          done
      - name: Run RSpec suite (including real Sidekiq integration)
        run: bundle exec rspec

      - name: Show Sidekiq logs on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/sidekiq.log" ]; then
            cat "$RUNNER_TEMP/sidekiq.log"
          fi

      - name: Stop Sidekiq worker
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sidekiq.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/sidekiq.pid")" 2>/dev/null || true
          fi

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v6.0.0
        if: always() && github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Upload coverage report
        if: ${{ always() && hashFiles('coverage/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
